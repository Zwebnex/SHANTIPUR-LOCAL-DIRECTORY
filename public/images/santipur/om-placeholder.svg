<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Warm Ivory / Subtle Cream Canvas Gradient -->
    <linearGradient id="creamCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="50%" stop-color="#F8F4EC" />
      <stop offset="100%" stop-color="#F2ECE0" />
    </linearGradient>

    <!-- Antique Gold Gradient for Sacred Om & Borders -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B868" />
      <stop offset="40%" stop-color="#B79550" />
      <stop offset="75%" stop-color="#9C7832" />
      <stop offset="100%" stop-color="#7D5C1E" />
    </linearGradient>

    <!-- Center Soft Warm Radiance Halo -->
    <radialGradient id="spiritualAura" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#B79550" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#D94B42" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#F8F4EC" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow for Om Symbol -->
    <filter id="softGoldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8F6E29" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Warm Cream Canvas -->
  <rect width="800" height="500" fill="url(#creamCanvas)" />

  <!-- Fine Subtle Gold Decorative Borders -->
  <rect x="22" y="22" width="756" height="456" rx="10" fill="none" stroke="url(#antiqueGold)" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="6 4" />
  <rect x="30" y="30" width="740" height="440" rx="6" fill="none" stroke="url(#antiqueGold)" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Center Spiritual Radiance Halo -->
  <circle cx="400" cy="215" r="150" fill="url(#spiritualAura)" />

  <!-- Concentric Ritual Rings -->
  <circle cx="400" cy="215" r="105" fill="none" stroke="url(#antiqueGold)" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4 4" />
  <circle cx="400" cy="215" r="92" fill="none" stroke="url(#antiqueGold)" stroke-width="1.6" stroke-opacity="0.7" />
  <circle cx="400" cy="215" r="80" fill="none" stroke="url(#antiqueGold)" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Radiating Cardinal Accents -->
  <line x1="400" y1="98" x2="400" y2="116" stroke="url(#antiqueGold)" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round" />
  <line x1="400" y1="314" x2="400" y2="332" stroke="url(#antiqueGold)" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round" />
  <line x1="283" y1="215" x2="301" y2="215" stroke="url(#antiqueGold)" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round" />
  <line x1="499" y1="215" x2="517" y2="215" stroke="url(#antiqueGold)" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round" />

  <!-- Elegant Corner Motifs -->
  <path d="M42 56 L56 42 M42 66 L66 42" stroke="url(#antiqueGold)" stroke-width="1" stroke-opacity="0.4" />
  <path d="M758 56 L744 42 M758 66 L734 42" stroke="url(#antiqueGold)" stroke-width="1" stroke-opacity="0.4" />
  <path d="M42 444 L56 458 M42 434 L66 458" stroke="url(#antiqueGold)" stroke-width="1" stroke-opacity="0.4" />
  <path d="M758 444 L744 458 M758 434 L734 458" stroke="url(#antiqueGold)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Precisely Centred Golden Om (ॐ) Emblem -->
  <text x="400" y="248" font-family="'Noto Serif Bengali', 'Times New Roman', Georgia, serif" font-size="110" font-weight="bold" fill="url(#antiqueGold)" text-anchor="middle" filter="url(#softGoldShadow)">ॐ</text>

  <!-- Clean Editorial Typography -->
  <text x="400" y="358" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2E2822" text-anchor="middle" letter-spacing="3">শ্রী শ্রী ওঁ • পবিত্র শান্তিপুর ঐতিহ্য</text>
  <text x="400" y="388" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#9C7832" text-anchor="middle" letter-spacing="2">PHOTOGRAPH UNAVAILABLE • AUTHENTIC ARCHIVE PENDING</text>
  <text x="400" y="412" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" fill="#756C62" text-anchor="middle" letter-spacing="1">Santipur Cultural &amp; Heritage Directory • PIN: 741404</text>
</svg>
