<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18" />
      <stop offset="50%" stop-color="#171513" />
      <stop offset="100%" stop-color="#0F0E0D" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#B79550" />
      <stop offset="100%" stop-color="#8C6A24" />
    </linearGradient>

    <radialGradient id="sacredGaze" cx="50%" cy="46%" r="45%">
      <stop offset="0%" stop-color="#D94B42" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#B79550" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0F0E0D" stop-opacity="0" />
    </radialGradient>

    <filter id="sacredGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGradient)" />

  <!-- Subtle Sacred Geometric Border -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6 4" />
  <rect x="28" y="28" width="744" height="444" rx="8" fill="none" stroke="url(#goldGradient)" stroke-width="0.8" stroke-opacity="0.2" />

  <!-- Center Spiritual Radiance Halo -->
  <circle cx="400" cy="220" r="160" fill="url(#sacredGaze)" />

  <!-- Outer Concentric Ritual Rings -->
  <circle cx="400" cy="220" r="110" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3" />
  <circle cx="400" cy="220" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.85" />
  <circle cx="400" cy="220" r="82" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Radiating Cardinal Rays -->
  <line x1="400" y1="100" x2="400" y2="120" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" />
  <line x1="400" y1="320" x2="400" y2="340" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" />
  <line x1="280" y1="220" x2="300" y2="220" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" />
  <line x1="500" y1="220" x2="520" y2="220" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" />

  <!-- Corner Traditional Corner Accents -->
  <path d="M40 55 L55 40 M40 65 L65 40" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4" />
  <path d="M760 55 L745 40 M760 65 L735 40" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4" />
  <path d="M40 445 L55 460 M40 435 L65 460" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4" />
  <path d="M760 445 L745 460 M760 435 L735 460" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4" />

  <!-- The Sacred Om (ॐ) Emblem -->
  <text x="400" y="252" font-family="'Noto Serif Bengali', 'Times New Roman', Georgia, serif" font-size="108" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" filter="url(#sacredGlow)">ॐ</text>

  <!-- Typography & Archival Attribution -->
  <text x="400" y="375" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FCEFD2" text-anchor="middle" letter-spacing="3">শ্রী শ্রী ওঁ • পবিত্র শান্তিপুর ঐতিহ্য</text>
  <text x="400" y="405" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D94B42" text-anchor="middle" letter-spacing="1.8">AUTHENTIC HERITAGE PHOTOGRAPH PENDING ARCHIVAL</text>
  <text x="400" y="428" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" fill="#9E9A93" text-anchor="middle" letter-spacing="1">Santipur Digital Directory • PIN: 741404</text>
</svg>